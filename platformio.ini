; PlatformIO Project Configuration File for Smart Energy Consumption and Electricity Cost Analyzer
; Hardware Target: ESP32-WROOM-32 (NodeMCU / DOIT ESP32 DEVKIT V1)
; Framework: Arduino

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Serial Monitor Baud Rate
monitor_speed = 115200

; Upload Port & Speed
upload_port = COM9
upload_speed = 115200

; Monitor filters to clean up serial output
monitor_filters = 
    default
    esp32_exception_decoder

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=0
