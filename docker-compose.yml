services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-energy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Option A: Connect to Neon Cloud Postgres (uncomment and replace with your Neon string)
      # - DATABASE_URL=postgresql://user:password@ep-xyz.aws.neon.tech/neondb?sslmode=require
      # Option B: Connect to the local Docker postgres container below
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=iot_energy_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: iot-energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot_energy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_energy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
